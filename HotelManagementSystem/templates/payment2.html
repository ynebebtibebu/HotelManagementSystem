<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/payment.css') }}">
</head>

<body>
    <header>
        <h1>Payment Information</h1>
    </header>

    <div class="container">
        <div class="payment-form">
            <h2>Enter Payment Details</h2>
            <form id="paymentForm">
                <label for="cardName">Name on Card:</label>
                <input type="text" id="cardName" name="cardName" placeholder="John Doe" required>

                <label for="cardNumber">Card Number:</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9101 1121" maxlength="16" required>

                <label for="expiryDate">Expiry Date:</label>
                <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" maxlength="5" required>

                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="3" required>

                <div class="btn-group">
                    <button type="submit" class="btn">Pay Now</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/payment.js"></script>
</body>

</html>
<script>
    // payment.js
document.getElementById('paymentForm').addEventListener('submit', function (event) {
    event.preventDefault();

    const paymentDetails = {
        cardName: document.getElementById('cardName').value,
        cardNumber: document.getElementById('cardNumber').value,
        expiryDate: document.getElementById('expiryDate').value,
        cvv: document.getElementById('cvv').value
    };

    // Validate payment details
    if (!paymentDetails.cardName || !paymentDetails.cardNumber || !paymentDetails.expiryDate || !paymentDetails.cvv) {
        alert("Please fill out all fields.");
        return;
    }

    // You can add further steps to process the payment, like calling an API for payment
    alert("Payment Successful!");
    window.location.href = 'success2.html';  // Redirect to a success page or confirmation
});

</script>
