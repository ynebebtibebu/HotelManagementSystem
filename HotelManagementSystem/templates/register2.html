<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='image/logo.jpg') }}" alt="logo">
        </div>
        <h1>Customer Management</h1>
    </header>

    <div class="container">
        <!-- Form Container -->
        <div class="form-container">
            <h2>Customer Details</h2>
            <form id="customerForm">

                <label for="customerRef">Customer Ref:</label>
                <input type="text" id="customerRef" name="customerRef" placeholder="This inpu is not accept  " readonly>
               

                <label for="customerName">Customer Name:</label>
                <input type="text" id="customerName" name="customerName" required>

                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="address">Address:</label>
                <input type="text" id="address" name="address">

                <label for="id">ID Number:</label>
                <input type="text" id="id" name="id">

                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="nationality">Nationality:</label>
                <select id="nationality" name="nationality">
                    <option value="">Select</option>
                    <option value="USA">USA</option>
                    <option value="India">India</option>
                    <option value="UK">UK</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                </select>

                <div class="btn-group">
                    <button type="button" class="btn" onclick="addCustomer()">Add</button>
                    <button type="button" class="btn" onclick="updateCustomer()">Update</button>
                    <button type="button" class="btn" onclick="deleteCustomer()">Delete</button>
                    <button type="button" class="btn" onclick="resetForm()">Reset</button>
                </div>
            </form>
        </div>
            

           
    <script>
        // Fetch the customers for the logged-in user

    // Add customer function
    function addCustomer() {
    const customer = {
        customerName: document.getElementById('customerName').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        address: document.getElementById('address').value,
        id: document.getElementById('id').value,
        gender: document.getElementById('gender').value,
        nationality: document.getElementById('nationality').value
    };

    // Validate the form data
    if (!customer.customerName || !customer.phone || !customer.email || !customer.address || !customer.id || !customer.gender || !customer.nationality) {
        alert("All fields are required.");
        return;
    }

    fetch('/customers', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(customer),
    })
    .then(response => {
        if (!response.ok) {
            throw new Error('Failed to add customer');
        }
        return response.json();
    })
    .then(data => {
        alert('Customer added successfully');
        window.location.href = 'payment2.html';  // Redirect to payment.html
    })
    .catch(error => {
        console.error('Error adding customer:', error);
        alert('Error adding customer: ' + error.message);
    });
}

    </script>
</body>

</html>
